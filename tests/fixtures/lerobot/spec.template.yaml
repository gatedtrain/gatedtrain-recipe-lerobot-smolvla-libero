# Area "VLA" fixture spec: LeRobot SmolVLA stage-2 SFT gated against its stage-1 base cut (verifier-owned; prototype,
# unpromotable). tests/README.md section 11.26. Rendered by tests/_lerobot.py: {base} is the stage-1 cut
# (<stage-1 run>/cuts/checkpoint-<step>/), {data} the frame export of the LIBERO-Object frames (frames_meta.json and one
# chunk-CCC_file-FFF.jsonl per data file), {items} the registered item set, {registration_sha256} the SHA-256 of the
# rendered registration.yaml.
workflow: ext-lerobot-fixture
version: 1
budget: {gpu_hours: 24}
artifacts:
  base:         {type: model_checkpoint, uri: "file:{base}"}
  frames:       {type: training_dataset, uri: "file:{data}"}
  items:        {type: item_set, uri: "file:{items}", disjoint_from: [frames]}
  trainer_cfg:  {type: trainer_config, uri: "file:trainer.yaml"}
  registration: {type: registration, uri: "file:registration.yaml@sha256:{registration_sha256}"}
stages:
  - id: sft
    uses: sft.lerobot@0.1
    algorithm: sft
    model_family: vla.smolvla@0.1
    inputs: {model: base, data: frames, config: trainer_cfg}
    outputs: {model: sft_ckpt}
  - id: quality_gate
    uses: gate.superiority@1.0
    evaluator: libero.lerobot_items@0.1
    sampler: deployment
    inputs: {model: sft_ckpt, baseline: base, items: items, registration: registration}
    test: {metric: success, alpha: 0.025, power: 0.80, mde: 0.3, cluster_by: item, seeds: 2}
    on_fail: stop
    owner: skeleton-demo
    escalation: [skeleton-demo-lead]
